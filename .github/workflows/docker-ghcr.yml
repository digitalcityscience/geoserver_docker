name: Build and Push GeoServer Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "docker/**"
      - "scripts/**"
      - "plugin_manager/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Multi-Arch Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GEOSERVER_VERSION: 2.28.5
      IMAGE_VERSION: 9.0.106-jdk17-temurin-jammy
      DEFAULT_OFFICIAL_PLUGINS: "gdal,monitor,vectortiles,mbstyle"
      DEFAULT_COMMUNITY_PLUGINS: "jdbcconfig,jdbcstore,sec-oauth2-openid-connect"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tosca-geoserver:${{ env.GEOSERVER_VERSION }}
            ghcr.io/${{ github.repository_owner }}/tosca-geoserver:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GEOSERVER_VERSION=${{ env.GEOSERVER_VERSION }}
            IMAGE_VERSION=${{ env.IMAGE_VERSION }}
            DEFAULT_OFFICIAL_PLUGINS=${{ env.DEFAULT_OFFICIAL_PLUGINS }}
            DEFAULT_COMMUNITY_PLUGINS=${{ env.DEFAULT_COMMUNITY_PLUGINS }}
          provenance: false
